<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Project Dashboard</title>
<style>
:root{--bg:#0e1424;--card:#1c2336;--mut:#9aa4bd;--red:#ef4444;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:Segoe UI,Roboto,Arial,sans-serif}
body{padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.g{display:grid;gap:10px;grid-template-columns:repeat(12,1fr);max-width:1300px;margin:auto}
.c{background:var(--card);border-radius:8px;overflow:hidden;min-width:0}.c h3{margin:0;background:#000;text-align:center;font-size:15px;padding:6px 8px;font-weight:600}
.b{padding:10px}
.title{grid-column:span 12;background:var(--card);border-radius:30px;text-align:center;padding:14px;font:700 24px Georgia,serif}
.title{display:flex;align-items:center;gap:16px;justify-content:center;padding:10px 20px}.title img{height:56px;width:auto;background:#fff;border-radius:10px;padding:4px 8px}.title div{text-align:center}.title small{display:block;font:12px Segoe UI,sans-serif;color:var(--mut);margin-top:2px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.date{display:flex;align-items:center;justify-content:center;font:700 20px Segoe UI;border:3px solid #2a3350;border-radius:24px;background:#0a0f1c}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.t{cursor:pointer;opacity:.45;border-color:var(--k)!important}.t.on{opacity:1;background:#1a2340}.t{background:#0a0f1c;border:2px solid #3a4260;border-radius:6px;padding:10px;text-align:center;font-size:12px}.t b{display:block;font-size:26px;margin-top:4px}
svg text{fill:#fff;font-family:Segoe UI,Roboto,Arial,sans-serif}.row{display:grid;grid-template-columns:150px 1fr 56px;gap:8px;align-items:center;font-size:12px;margin:6px 0}
.bar{height:14px;background:#0a0f1c;border-radius:3px;position:relative}.bar.tall{height:28px}.ctr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;text-shadow:0 0 3px #000,0 0 3px #000}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);padding:6px 10px;flex-wrap:wrap}.leg span:before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px;background:var(--k)}
ul{margin:0;padding:10px 10px 10px 28px;font-size:13px;line-height:1.7}.stk{display:flex;height:22px;border-radius:3px;overflow:hidden;background:#0a0f1c}.stk i{display:block;height:100%}
.tabs{display:flex;gap:6px;padding:8px 10px 0;flex-wrap:wrap}.tabs button{background:#0a0f1c;color:#fff;border:1px solid #3a4260;border-radius:14px;padding:4px 12px;cursor:pointer;font-size:12px}.tabs button.on{background:#2b2bb0;border-color:#2b2bb0}
@media(max-width:860px){.title{flex-direction:column}}.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
@media(max-width:860px){.s3,.s4,.s6,.s8{grid-column:span 12}.title{font-size:18px}.row{grid-template-columns:100px 1fr 40px}.gl{grid-template-columns:repeat(2,1fr)}.date{padding:14px}}
</style></head><body><div class="g">
<div class="title"><img id="logo" alt="" hidden><div><span id="ttl"></span><small id="sub"></small></div></div>
<div class="c s3"><h3 data-l="submissions">Total of Submissions</h3><div class="b"><svg id="gSub" viewBox="0 0 220 130"></svg></div></div>
<div class="c s3"><h3 data-l="overall">Overall Progress</h3><div class="b"><svg id="gOv" viewBox="0 0 220 130"></svg></div></div>
<div class="c s3"><h3 data-l="weekly">Weekly Progress</h3><div class="b" id="wk"></div></div>
<div class="c s3 date" id="dt"></div>
<div class="c s12"><h3 data-l="logs">Submittal logs</h3><div class="b gl" id="gl"></div></div>
<div class="c s4"><h3 data-l="statusFilter">Status (filter)</h3><div class="tabs"><button id="all">All</button><button id="none">Clear</button></div><div class="tiles" id="tiles"></div></div>
<div class="c s8"><h3 data-l="statusByLog">Status by log</h3><div class="b" id="stk"></div><div class="leg" id="lg"></div></div>
<div class="c s6"><h3 data-l="floors">Progress by floor</h3><div class="b" id="fl"></div><div class="leg"><span style="--k:#2b2bb0">Actual</span><span style="--k:#ef4444">Planned to date</span></div></div>
<div class="c s6"><h3 data-l="activities">Activity progress</h3><div class="tabs" id="tb"></div><div class="b" id="act"></div></div>
<div class="c s6"><h3 data-l="lookahead">One-week lookahead plan</h3><ul id="la"></ul></div>
<div class="c s6"><h3 data-l="transmittals">Weekly progress transmittals</h3><div class="b" id="trn"></div></div>
<div class="c s12" id="err" hidden style="padding:14px;color:#ffb4b4"></div>
</div><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const fetchJson=f=>fetch(f+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' returned '+r.status);return r.json()});
let C,D,sel=new Set(),cur='',TODAY;
function gauge(id,v,max,col,lab,mark){const R=80,cx=110,cy=110;
const arc=f=>{const a=Math.PI*f;return `M${cx-R} ${cy}A${R} ${R} 0 0 1 ${cx-R*Math.cos(a)} ${cy-R*Math.sin(a)}`};
let s=`<path d="${arc(.999)}" fill="none" stroke="#f1f1f1" stroke-width="30"/>`+(v>0?`<path d="${arc(Math.min(v/max,.999))}" fill="none" stroke="${col}" stroke-width="30"/>`:'');
if(mark!=null){const a=Math.PI*mark/100,c=Math.cos(a),n=Math.sin(a);s+=`<line x1="${cx-(R-15)*c}" y1="${cy-(R-15)*n}" x2="${cx-(R+15)*c}" y2="${cy-(R+15)*n}" stroke="#ef4444" stroke-width="3"/>`}
s+=`<text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="30" font-weight="700">${esc(lab)}</text><text x="${cx-R}" y="126" text-anchor="middle" font-size="11">0</text><text x="${cx+R}" y="126" text-anchor="middle" font-size="11">${max}</text>`;$(id).innerHTML=s}
let PLAN;const plan=t=>{const s=new Date(t.start+'T08:00'),f=new Date(t.finish+'T17:00');return Math.max(0,Math.min(1,(PLAN-s)/(f-s)))*100};
const lt=l=>Object.values(l.counts).reduce((a,b)=>a+b,0);
const cnt=(l,k)=>l.counts[k]||0;
function renderStatus(){const S=C.statuses;
$('tiles').innerHTML=S.map(x=>`<div class="t ${sel.has(x.key)?'on':''}" data-k="${esc(x.key)}" style="--k:${x.color}">${esc(x.label)}<b>${D.logs.reduce((a,l)=>a+cnt(l,x.key),0)}</b></div>`).join('');
$('tiles').querySelectorAll('.t').forEach(t=>t.onclick=()=>{const k=t.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);renderStatus()});
$('stk').innerHTML=D.logs.map(l=>{const T=lt(l),on=S.filter(x=>sel.has(x.key));return `<div class="row"><span>${esc(l.name)}</span><div class="stk">${on.map(x=>`<i title="${esc(x.label)}: ${cnt(l,x.key)}" style="width:${T?cnt(l,x.key)/T*100:0}%;background:${x.color}"></i>`).join('')}</div><b>${on.length==S.length?T:on.reduce((a,x)=>a+cnt(l,x.key),0)+'/'+T}</b></div>`}).join('');
$('lg').innerHTML=S.map(x=>`<span style="--k:${x.color}">${esc(x.key)}</span>`).join('')}
function renderActs(){const F=C.floors;$('tb').innerHTML=F.map(f=>`<button class="${f.key==cur?'on':''}" data-f="${esc(f.key)}">${esc(f.label)}</button>`).join('');
$('tb').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.f;renderActs()});
$('act').innerHTML=D.tasks.filter(t=>t.floor==cur).map(t=>`<div class="row"><span>${esc(t.name)}</span><div class="bar"><i style="width:${t.percent}%;background:#e8892b"></i><u style="left:${plan(t)}%"></u></div><b>${t.percent}%</b></div>`).join('')}
function render(){
$('ttl').textContent=C.title;$('sub').textContent=C.subtitle||'';document.title=C.title;
if(C.logo){$('logo').src=C.logo;$('logo').alt=C.logoAlt||'';$('logo').hidden=false}
document.querySelectorAll('[data-l]').forEach(e=>{if(C.labels&&C.labels[e.dataset.l])e.textContent=C.labels[e.dataset.l]});
TODAY=new Date(D.reportDate+'T12:00');PLAN=new Date(D.planAsOf||(D.reportDate+'T17:00'));$('dt').textContent=TODAY.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
const pAll=avg(D.tasks.map(plan)),act=D.overall.actual,prev=D.overall.previous;
const tot=D.logs.reduce((a,l)=>a+lt(l),0)+(D.transmittals||[]).length;
gauge('gSub',tot,D.submissionsTarget||100,'#2b2bb0',tot);
gauge('gOv',act,100,'#2b2bb0',act+'%',pAll);
const two=(a,b,c,d,col)=>`<table style="width:100%;text-align:center;font-size:13px"><tr><td style="color:var(--mut)">${a}</td><td style="color:var(--mut)">${c}</td></tr><tr><td style="font-size:26px;font-weight:700">${b}</td><td style="font-size:26px;font-weight:700;color:${col}">${d}</td></tr></table>`;
$('wk').innerHTML=prev!=null?two('Progress prev.',prev+'%','Weekly progress',(act-prev).toFixed(2)+'%','#3ddc3d'):two('Actual',act+'%','Planned to date',pAll.toFixed(1)+'%','#ef4444')+`<div style="font-size:12px;color:var(--mut);margin-top:8px;text-align:center">Variance ${(act-pAll).toFixed(1)} pts · plan as of ${PLAN.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div>`;
const gid=(l,i)=>'g_'+i;
$('gl').innerHTML=D.logs.map((l,i)=>`<div><div style="text-align:center;font-size:13px;font-weight:600">${esc(l.name)}</div><svg viewBox="0 0 220 130" id="${gid(l,i)}"></svg></div>`).join('');
D.logs.forEach((l,i)=>{const r=lt(l)-cnt(l,C.waitingKey||'W');gauge(gid(l,i),r,lt(l),'#e8892b',r)});
if(!sel.size&&!render.done)sel=new Set(C.statuses.map(x=>x.key));renderStatus();
$('all').onclick=()=>{sel=new Set(C.statuses.map(x=>x.key));renderStatus()};$('none').onclick=()=>{sel=new Set();renderStatus()};
$('fl').innerHTML=C.floors.map(f=>{const a=D.tasks.filter(t=>t.floor==f.key),A=avg(a.map(t=>t.percent)),P=avg(a.map(plan));return `<div class="row" style="grid-template-columns:110px 1fr"><span>${esc(f.label)}</span><div class="bar tall"><i style="width:${A}%;background:#2b2bb0"></i><u style="left:${P}%"></u><span class="ctr">${A.toFixed(1)}%</span></div></div>`}).join('');
if(!cur)cur=C.floors[0].key;renderActs();
$('la').innerHTML=(D.lookahead||[]).map(x=>`<li>${esc(x)}</li>`).join('');
const TR=D.transmittals||[];
$('trn').innerHTML=TR.map(x=>`<div class="row" style="grid-template-columns:200px 1fr 60px"><span>Weekly Progress ${esc(x.no)} <span style="color:var(--mut)">(${esc(x.period)})</span></span><div class="bar"><i style="width:100%;background:#3ddc3d"></i></div><b style="font-size:11px">${esc(x.sent)}</b></div>`).join('')+`<div style="font-size:13px;margin-top:8px">Total: <b>${TR.length}</b> weekly progress reports transmitted${TR.length?' (latest: '+esc(TR[TR.length-1].no)+')':''}. Sent date shown.</div>`;
render.done=true}
Promise.all([fetchJson('config.json'),fetchJson('data.json')]).then(([c,d])=>{C=c;D=d;render()}).catch(e=>{const x=$('err');x.hidden=false;x.textContent='Could not load config.json / data.json ('+e.message+'). Open this page from GitHub Pages or a local web server, not by double-clicking the file.'});
</script></body></html>
